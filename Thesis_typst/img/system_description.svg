<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 870" width="1060" height="870" font-family="'CMU Serif', 'Latin Modern Roman', Georgia, serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="am" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/>
    </marker>
    <!-- New green marker for controllable commands -->
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1060" height="870" fill="white"/>
  <rect width="1060" height="870" fill="url(#grid)"/>

  <!-- ════════════════════════════════════════════════ -->
  <!--  CAN BUS — dual wire                            -->
  <!-- ════════════════════════════════════════════════ -->
  <line x1="78" y1="295" x2="970" y2="295" stroke="#334155" stroke-width="2.5"/>
  <line x1="78" y1="319" x2="970" y2="319" stroke="#334155" stroke-width="2.5"/>
  <text x="850" y="289" text-anchor="middle" font-size="10" fill="#64748b">CAN_H</text>
  <text x="850" y="337" text-anchor="middle" font-size="10" fill="#64748b">CAN_L</text>
  <!-- CAN bus description — far right, no overlap -->
  <text x="850" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">CAN Bus  (1 Mbit/s, 29-bit extended ID)</text>

  <!-- ── Left 120 Ω terminator (zigzag) ── -->
  <line x1="78" y1="295" x2="78" y2="298" stroke="#64748b" stroke-width="1.3"/>
  <polyline points="78,298 83,300.5 73,303.5 83,306.5 73,309.5 83,312.5 78,315"
            fill="none" stroke="#64748b" stroke-width="1.3" stroke-linejoin="round"/>
  <line x1="78" y1="315" x2="78" y2="319" stroke="#64748b" stroke-width="1.3"/>
  <text x="57" y="311" text-anchor="middle" font-size="9" fill="#94a3b8">120Ω</text>

  <!-- ── Right 120 Ω terminator ── -->
  <line x1="970" y1="295" x2="970" y2="298" stroke="#64748b" stroke-width="1.3"/>
  <polyline points="970,298 975,300.5 965,303.5 975,306.5 965,309.5 975,312.5 970,315"
            fill="none" stroke="#64748b" stroke-width="1.3" stroke-linejoin="round"/>
  <line x1="970" y1="315" x2="970" y2="319" stroke="#64748b" stroke-width="1.3"/>
  <text x="991" y="311" text-anchor="middle" font-size="9" fill="#94a3b8">120Ω</text>

  <!-- ════════════════════════════════════════════════ -->
  <!--  SSH / DEVELOPER PC                             -->
  <!-- ════════════════════════════════════════════════ -->
  <g transform="translate(30, 40)">
    <rect width="135" height="54" rx="5" fill="#faf5ff" stroke="#9333ea" stroke-width="1.2"/>
    <text x="68" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">Developer PC</text>
    <text x="68" y="39" text-anchor="middle" font-size="10" fill="#9333ea">SSH terminal</text>
  </g>
  <line x1="165" y1="67" x2="390" y2="67" stroke="#9333ea" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#am)"/>
  <text x="278" y="59" text-anchor="middle" font-size="9.5" fill="#9333ea">SSH / Ethernet</text>

  <!-- ════════════════════════════════════════════════ -->
  <!--  SUPERVISOR                                     -->
  <!-- ════════════════════════════════════════════════ -->
  <g transform="translate(395, 18)">
    <rect width="240" height="155" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect width="240" height="30" rx="6" fill="#2563eb"/>
    <rect y="22" width="240" height="10" fill="#2563eb"/>
    <text x="120" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Supervisor</text>
    <text x="120" y="50" text-anchor="middle" font-size="12" fill="#1e40af">ARM Linux SBC</text>
    <rect x="20" y="60" width="200" height="38" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="120" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Synthesized Supervisor</text>
    <text x="120" y="91" text-anchor="middle" font-size="10" fill="#3b82f6">CIF → C99 generated code</text>
    <rect x="35" y="108" width="170" height="24" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.8"/>
    <text x="120" y="124" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">SocketCAN</text>
  </g>

  <!-- SN65HVD230 transceiver OUTSIDE supervisor box -->
  <rect x="445" y="220" width="140" height="20" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="515" y="234" text-anchor="middle" font-size="9" fill="#64748b">SN65HVD230</text>

  <!-- Supervisor: curved arrows SocketCAN ↔ transceiver -->
  <!-- Command arrow: changed from blue to green (#16a34a) with green marker -->
  <path d="M 497,173 Q 470,197 497,220" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#ag)"/>
  <path d="M 533,220 Q 560,197 533,173" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="462" y="200" text-anchor="end" font-size="10.5" font-weight="bold" fill="#16a34a">commands</text>
  <text x="568" y="200" font-size="10.5" font-weight="bold" fill="#dc2626">events</text>

  <!-- Supervisor transceiver → CAN bus: PLAIN WIRES -->
  <line x1="505" y1="240" x2="505" y2="295" stroke="#334155" stroke-width="1.8"/>
  <line x1="525" y1="240" x2="525" y2="319" stroke="#334155" stroke-width="1.8"/>


  <!-- ════════════════════════════════════════════════ -->
  <!--  NODE 1    (node box at y=460, 60px gap)        -->
  <!-- ════════════════════════════════════════════════ -->

  <!-- Node 1 CAN stubs — PLAIN WIRES -->
  <line x1="155" y1="295" x2="155" y2="382" stroke="#334155" stroke-width="1.8"/>
  <line x1="185" y1="319" x2="185" y2="382" stroke="#334155" stroke-width="1.8"/>

  <!-- Node 1 transceiver -->
  <rect x="100" y="382" width="140" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="170" y="395" text-anchor="middle" font-size="8.5" fill="#64748b">SN65HVD230</text>

  <!-- Node 1: curved arrows  transceiver ↔ node box -->
  <!-- Command arrow: changed stroke to green (#16a34a) and marker to green; also fixed inconsistent green -->
  <path d="M 148,400 Q 118,430 148,460" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ag)"/>
  <path d="M 192,460 Q 222,430 192,400" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar)"/>
  <!-- Labels: cmd changed to green, evt stays red -->
  <text x="108" y="434" text-anchor="end" font-size="9.5" font-weight="bold" fill="#16a34a">cmd</text>
  <text x="232" y="434" font-size="9.5" font-weight="bold" fill="#dc2626">evt</text>

  <!-- Node 1 box  (translate y pushed to 460) -->
  <g transform="translate(68, 460)">
    <rect width="206" height="210" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="206" height="28" rx="6" fill="#16a34a"/>
    <rect y="20" width="206" height="10" fill="#16a34a"/>
    <text x="103" y="19" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Node 1</text>

    <!-- Teensy -->
    <rect x="12" y="38" width="182" height="36" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="103" y="54" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Teensy 4.0</text>
    <text x="103" y="67" text-anchor="middle" font-size="9.5" fill="#16a34a">SimpleFOC  +  FSM  +  CAN</text>

    <!-- DRV8302   absolute: x=80..262  y=544..582  center_y=563 -->
    <rect x="12" y="84" width="182" height="38" rx="3" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
    <text x="103" y="100" text-anchor="middle" font-size="11" fill="#854d0e">DRV8302</text>
    <text x="103" y="114" text-anchor="middle" font-size="9" fill="#a16207">3φ gate driver + current sense</text>
    <!-- Power polarity indicators on DRV8302 edges -->
    <text x="5" y="107" text-anchor="end" font-size="13" font-weight="bold" fill="#475569">−</text>
    <text x="201" y="107" font-size="13" font-weight="bold" fill="#dc2626">+</text>

    <!-- Motor -->
    <circle cx="103" cy="170" r="30" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="103" y="167" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">BLDC</text>
    <text x="103" y="179" text-anchor="middle" font-size="8.5" fill="#64748b">7pp motor</text>
    <line x1="84" y1="123" x2="85" y2="142" stroke="#ef4444" stroke-width="1.2"/>
    <line x1="103" y1="122" x2="103" y2="140" stroke="#eab308" stroke-width="1.2"/>
    <line x1="122" y1="123" x2="121" y2="142" stroke="#3b82f6" stroke-width="1.2"/>
  </g>


  <!-- ════════════════════════════════════════════════ -->
  <!--  NODE 2                                         -->
  <!-- ════════════════════════════════════════════════ -->

  <!-- Node 2 CAN stubs — PLAIN WIRES -->
  <line x1="405" y1="295" x2="405" y2="382" stroke="#334155" stroke-width="1.8"/>
  <line x1="435" y1="319" x2="435" y2="382" stroke="#334155" stroke-width="1.8"/>

  <rect x="350" y="382" width="140" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="420" y="395" text-anchor="middle" font-size="8.5" fill="#64748b">SN65HVD230</text>

  <!-- Node 2: curved arrows  transceiver ↔ node box -->
  <!-- Command arrow: changed from blue to green -->
  <path d="M 398,400 Q 368,430 398,460" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ag)"/>
  <path d="M 442,460 Q 472,430 442,400" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="358" y="434" text-anchor="end" font-size="9.5" font-weight="bold" fill="#16a34a">cmd</text>
  <text x="482" y="434" font-size="9.5" font-weight="bold" fill="#dc2626">evt</text>

  <g transform="translate(318, 460)">
    <rect width="206" height="210" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="206" height="28" rx="6" fill="#16a34a"/>
    <rect y="20" width="206" height="10" fill="#16a34a"/>
    <text x="103" y="19" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Node 2</text>

    <rect x="12" y="38" width="182" height="36" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="103" y="54" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Teensy 4.0</text>
    <text x="103" y="67" text-anchor="middle" font-size="9.5" fill="#16a34a">SimpleFOC  +  FSM  +  CAN</text>

    <rect x="12" y="84" width="182" height="38" rx="3" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
    <text x="103" y="100" text-anchor="middle" font-size="11" fill="#854d0e">DRV8302</text>
    <text x="103" y="114" text-anchor="middle" font-size="9" fill="#a16207">3φ gate driver + current sense</text>
    <text x="5" y="107" text-anchor="end" font-size="13" font-weight="bold" fill="#475569">−</text>
    <text x="201" y="107" font-size="13" font-weight="bold" fill="#dc2626">+</text>

    <circle cx="103" cy="170" r="30" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="103" y="167" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">BLDC</text>
    <text x="103" y="179" text-anchor="middle" font-size="8.5" fill="#64748b">7pp motor</text>
    <line x1="84" y1="123" x2="85" y2="142" stroke="#ef4444" stroke-width="1.2"/>
    <line x1="103" y1="122" x2="103" y2="140" stroke="#eab308" stroke-width="1.2"/>
    <line x1="122" y1="123" x2="121" y2="142" stroke="#3b82f6" stroke-width="1.2"/>
  </g>


  <!-- ════════════════════════════════════════════════ -->
  <!--  NODE N — dashed                                -->
  <!-- ════════════════════════════════════════════════ -->

  <!-- Node N CAN stubs — PLAIN WIRES (dashed) -->
  <line x1="655" y1="295" x2="655" y2="382" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="685" y1="319" x2="685" y2="382" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <rect x="600" y="382" width="140" height="18" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="670" y="395" text-anchor="middle" font-size="8.5" fill="#94a3b8">SN65HVD230</text>

  <!-- Node N: curved arrows (dashed) - command arrow changed to green -->
  <path d="M 648,400 Q 618,430 648,460" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5" marker-end="url(#ag)"/>
  <path d="M 692,460 Q 722,430 692,400" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5" marker-end="url(#ar)"/>

  <g transform="translate(568, 460)">
    <rect width="206" height="210" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect width="206" height="28" rx="6" fill="#94a3b8"/>
    <rect y="20" width="206" height="10" fill="#94a3b8"/>
    <text x="103" y="19" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Node N</text>

    <rect x="12" y="38" width="182" height="36" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="103" y="54" text-anchor="middle" font-size="11" fill="#64748b">Teensy 4.0</text>
    <text x="103" y="67" text-anchor="middle" font-size="9.5" fill="#94a3b8">SimpleFOC  +  FSM  +  CAN</text>

    <rect x="12" y="84" width="182" height="38" rx="3" fill="#fefce8" stroke="#fde047" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="103" y="100" text-anchor="middle" font-size="11" fill="#a16207" opacity="0.6">DRV8302</text>
    <text x="5" y="107" text-anchor="end" font-size="13" fill="#94a3b8">−</text>
    <text x="201" y="107" font-size="13" fill="#94a3b8">+</text>

    <circle cx="103" cy="170" r="30" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="103" y="167" text-anchor="middle" font-size="10" fill="#94a3b8">BLDC</text>
    <text x="103" y="179" text-anchor="middle" font-size="8.5" fill="#cbd5e1">Motor</text>
  </g>


  <!-- ════════════════════════════════════════════════ -->
  <!--  12 V DC POWER SUPPLY + RAIL                    -->
  <!--  +12V → right side of DRV8302  (+ side)         -->
  <!--  GND  → left side of DRV8302   (− side)         -->
  <!--  DRV8302 abs:  y=544..582   center_y=563        -->
  <!--  Node1: left=80  right=262                      -->
  <!--  Node2: left=330 right=512                      -->
  <!--  NodeN: left=580 right=762                      -->
  <!-- ════════════════════════════════════════════════ -->

  <!-- PSU box -->
  <g transform="translate(840, 690)">
    <rect width="160" height="60" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="80" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">Power Supply</text>
    <text x="80" y="39" text-anchor="middle" font-size="11.5" fill="#b91c1c">12 V DC  /  40 A</text>
    <text x="80" y="52" text-anchor="middle" font-size="9" fill="#ef4444">switched-mode</text>
  </g>

  <!-- +12V rail  (red, y=712) -->
  <rect x="58" y="709" width="780" height="6" rx="3" fill="#dc2626" opacity="0.12"/>
  <line x1="58" y1="712" x2="838" y2="712" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <text x="47" y="716" text-anchor="end" font-size="10" font-weight="bold" fill="#dc2626">+12 V</text>

  <!-- GND rail  (dark, y=728) -->
  <rect x="58" y="725" width="780" height="4" rx="2" fill="#1e293b" opacity="0.08"/>
  <line x1="58" y1="728" x2="838" y2="728" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="47" y="732" text-anchor="end" font-size="9" fill="#475569">GND</text>

  <!-- ── Node 1 power taps ── -->
  <!-- +12V  → right side of DRV8302 (x=262) -->
  <circle cx="262" cy="712" r="3" fill="#dc2626"/>
  <line x1="262" y1="712" x2="262" y2="563" stroke="#dc2626" stroke-width="1.8"/>
  <!-- GND   → left side of DRV8302 (x=80) -->
  <circle cx="80" cy="728" r="2" fill="#1e293b"/>
  <line x1="80" y1="728" x2="80" y2="563" stroke="#1e293b" stroke-width="1.2"/>

  <!-- ── Node 2 power taps ── -->
  <!-- +12V  → right side (x=512) -->
  <circle cx="512" cy="712" r="3" fill="#dc2626"/>
  <line x1="512" y1="712" x2="512" y2="563" stroke="#dc2626" stroke-width="1.8"/>
  <!-- GND   → left side (x=330) -->
  <circle cx="330" cy="728" r="2" fill="#1e293b"/>
  <line x1="330" y1="728" x2="330" y2="563" stroke="#1e293b" stroke-width="1.2"/>

  <!-- ── Node N power taps (dashed) ── -->
  <!-- +12V  → right side (x=762) -->
  <circle cx="762" cy="712" r="3" fill="#dc2626" opacity="0.5"/>
  <line x1="762" y1="712" x2="762" y2="563" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.5"/>
  <!-- GND   → left side (x=580) -->
  <circle cx="580" cy="728" r="2" fill="#1e293b" opacity="0.5"/>
  <line x1="580" y1="728" x2="580" y2="563" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>


  <!-- ════════════════════════════════════════════════ -->
  <!--  LEGEND                                         -->
  <!-- ════════════════════════════════════════════════ -->
  <g transform="translate(55, 780)">
    <rect x="-10" y="-16" width="570" height="76" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Controllable line changed from blue to green with green arrowhead -->
    <line x1="0" y1="0" x2="35" y2="0" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
    <text x="44" y="4" font-size="10.5" fill="#334155">Controllable — supervisor sends commands to nodes  (CAN register writes, pkt 0x2)</text>

    <line x1="35" y1="22" x2="0" y2="22" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="44" y="26" font-size="10.5" fill="#334155">Uncontrollable — nodes push event notifications to supervisor  (CAN pkt 0x4)</text>

    <rect x="0" y="40" width="85" height="12" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="94" y="51" font-size="10.5" fill="#334155">SN65HVD230 CAN transceiver — physical layer on every bus participant</text>
  </g>

</svg>